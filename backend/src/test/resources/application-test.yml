spring:
  datasource:
    url: jdbc:h2:mem:aisetup-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  h2:
    console:
      enabled: false

aisetup:
  cors:
    allowed-origins: http://localhost:5173
  anthropic:
    api-key:
  security:
    jwt-secret: test-jwt-secret-at-least-thirty-two-characters-long
    jwt-expiration-ms: 3600000
  seed-users: true
  demo-mode-enabled: true
  upload-dir: ./data/test-uploads
