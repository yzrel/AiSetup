spring:
  application:
    name: aisetup-backend
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:h2:file:./data/aisetup;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      # Schema is owned by Flyway; Hibernate only validates the entity mapping.
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    # {vendor} resolves from the datasource: db/migration/h2 locally, db/migration/mysql in prod.
    locations: classpath:db/migration/{vendor}
  h2:
    console:
      # Disabled by default: the console exposes full SQL access (sa / no password).
      # Opt in for local debugging only: H2_CONSOLE_ENABLED=true
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
  port: 8080
  servlet:
    context-path: /api

aisetup:
  cors:
    allowed-origins: http://localhost:5173
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-sonnet-4-20250514
    max-tokens: 1500
  security:
    jwt-secret: ${JWT_SECRET:aisetup-dev-jwt-secret-change-me-in-production-32chars-min}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  seed-users: ${AISETUP_SEED_USERS:true}
  demo-mode-enabled: ${AISETUP_DEMO_MODE:true}
  upload-dir: ${AISETUP_UPLOAD_DIR:./data/uploads}
  mail:
    from: ${MAIL_FROM:}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
  sms:
    api-key: ${SEMAPHORE_API_KEY:}
    sender-name: ${SEMAPHORE_SENDER_NAME:DOSTXII}
